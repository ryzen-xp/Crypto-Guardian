name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Check & Build
    runs-on: ubuntu-latest

    env:
      VENICE_API_KEY: ci_placeholder
      ONESHOT_API_KEY: ci_placeholder
      ONESHOT_API_URL: https://api.1shotapi.com
      ONESHOT_WEBHOOK_SECRET: ci_placeholder
      NEXT_PUBLIC_WALLET_CONNECT_ID: ci_placeholder
      NEXT_PUBLIC_CHAIN_ID: 8453
      NEXT_PUBLIC_USDC_ADDRESS: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
      NEXT_PUBLIC_UNISWAP_ROUTER: '0x2626664c2603336E57B271c5C0b26F421741e481'
      NEXT_PUBLIC_APP_URL: https://cryptoguardian.vercel.app
      NEXTAUTH_SECRET: ci_placeholder_secret_32chars

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build
